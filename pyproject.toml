[project]
name = "siaes"
version = "0.1.0"
description = "Sistema Integrado de Atendimento e Execução de Serviços - MVP da oficina mecânica (Tech Challenge Fase 1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "slowapi>=0.1.9",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pytest-asyncio>=0.24",
    "pip-audit>=2.10.1",
    "bandit>=1.9.4",
    "locust>=2.32",
    "import-linter>=2.17",
]

[tool.uv]
# A mesma versão do Dockerfile e do CI: outra versão reescreve o `uv.lock` em outro formato.
required-version = "==0.8.22"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/domain", "src/application"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.importlinter]
root_packages = ["domain", "application", "infrastructure", "presentation"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domínio isolado de camadas externas e frameworks"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = [
    "application",
    "infrastructure",
    "presentation",
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "asyncpg",
    "jwt",
    "bcrypt",
]

[[tool.importlinter.contracts]]
name = "Aplicação isolada de infraestrutura e apresentação"
type = "forbidden"
source_modules = ["application"]
forbidden_modules = ["infrastructure", "presentation"]

[[tool.importlinter.contracts]]
name = "Infraestrutura não importa apresentação"
type = "forbidden"
source_modules = ["infrastructure"]
forbidden_modules = ["presentation"]

[[tool.importlinter.contracts]]
name = "Apresentação não importa infraestrutura (exceto container)"
type = "forbidden"
source_modules = ["presentation"]
forbidden_modules = ["infrastructure"]
ignore_imports = ["presentation.container -> infrastructure.**"]
